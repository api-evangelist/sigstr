name: Sigstr
description: Sigstr was an Indianapolis-based email signature marketing and account-based
  marketing (ABM) platform that turned employee email signatures into a targeted marketing
  channel, backed by Battery Ventures and other investors. It was acquired by Terminus
  in September 2019 and folded into the Terminus platform as its Email Experiences /
  signature marketing product; the standalone Sigstr brand has since been retired. As
  of this enrichment pass the sigstr.com domain is a parked WP Engine page (HTTP 404),
  no api./developer. hosts resolve, and app.sigstr.com CNAMEs to Terminus infrastructure
  (email2.terminusplatform.com) — the company publishes no public API surface to enrich.
